<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080714">
  <meta name="description" content="Un espacio personal de diseño y enlaces.">
  <title>NOCTIS — Mi espacio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="forest.css">
</head>
<body class="public-page">
  <main id="profile-root" aria-label="Perfil personalizado"></main>
  <script src="profile.js"></script>
  <script src="forest.js"></script>
  <script>
    fetch('./config.json', {cache:'no-store'})
      .then(response => { if (!response.ok) throw Error('config.json no disponible'); return response.json(); })
      .then(config => ProfileStudio.render(document.getElementById('profile-root'), config, {mode:'public'}))
      .catch(() => ProfileStudio.render(document.getElementById('profile-root'), ProfileStudio.defaults, {mode:'public'}));
  </script>
</body>
</html>
